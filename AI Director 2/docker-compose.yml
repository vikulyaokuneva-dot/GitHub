services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wb_autopilot
      POSTGRES_USER: wb_autopilot
      POSTGRES_PASSWORD: wb_autopilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wb_autopilot -d wb_autopilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: wb_autopilot
      RABBITMQ_DEFAULT_PASS: wb_autopilot
      RABBITMQ_DEFAULT_VHOST: wb_autopilot
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
