[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-autopilot"
version = "0.1.0"
description = "Multi-tenant Wildberries Autopilot platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "celery>=5.4,<6",
    "cryptography>=44,<46",
    "fastapi>=0.115,<1",
    "pydantic>=2.12,<3",
    "redis>=5.2,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "packages", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
