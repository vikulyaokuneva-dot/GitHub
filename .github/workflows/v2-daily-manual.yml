name: V2 Daily Manual

on:
  workflow_dispatch:

jobs:
  v2_daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Moscow

      # WB / app config
      WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
      WB_TAX_RATE: ${{ vars.WB_TAX_RATE || '0.06' }}
      WB_TIMEZONE: Europe/Moscow
      WB_MAX_FINANCE_LAG_DAYS: ${{ vars.WB_MAX_FINANCE_LAG_DAYS || '3' }}

      # GigaChat
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-2' }}
      GIGACHAT_TIMEOUT_SEC: ${{ vars.GIGACHAT_TIMEOUT_SEC || '60' }}
      GIGACHAT_VERIFY_SSL_CERTS: ${{ vars.GIGACHAT_VERIFY_SSL_CERTS || 'false' }}

      # Email
      YANDEX_SMTP_USER: ${{ secrets.YANDEX_SMTP_USER }}
      YANDEX_SMTP_APP_PASS: ${{ secrets.YANDEX_SMTP_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      YANDEX_SMTP_HOST: ${{ vars.YANDEX_SMTP_HOST || 'smtp.yandex.com' }}
      YANDEX_SMTP_PORT: ${{ vars.YANDEX_SMTP_PORT || '465' }}
      YANDEX_SMTP_SECURITY: ${{ vars.YANDEX_SMTP_SECURITY || 'ssl' }}
      YANDEX_SMTP_TIMEOUT_SECONDS: ${{ vars.YANDEX_SMTP_TIMEOUT_SECONDS || '30' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output folders
        run: |
          mkdir -p out
          mkdir -p out/raw
          mkdir -p out/snapshots

      - name: Run V2 daily pipeline
        run: |
          set -euo pipefail
          python -m src.main

      - name: Print output files
        if: always()
        run: |
          echo "Artifacts in ./out:"
          find out -maxdepth 2 -type f | sort || true

      - name: Upload V2 daily artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-daily-out
          path: out/**
