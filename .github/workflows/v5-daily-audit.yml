name: V5 Daily Audit (File Mode)

on:
  schedule:
    # Optional: different schedule for audit mode (e.g., evenings)
    # 20:00 Europe/Moscow == 17:00 UTC.
    # - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      seller_id:
        description: "Seller ID (default: seller_001)"
        required: false
        default: "seller_001"
      run_date:
        description: "Optional audit date YYYY-MM-DD (empty = auto-resolve)"
        required: false
        default: ""

jobs:
  v5_daily_audit:
    if: ${{ vars.V5_AUDIT_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # V5 config
      V5_SELLER_ID: ${{ github.event.inputs.seller_id || vars.V5_AUDIT_SELLER || 'seller_001' }}
      V5_REQUESTED_DATE: ${{ github.event.inputs.run_date || '' }}
      V5_MODE: audit
      TZ: Europe/Moscow

      # WB API (optional for audit, shared with v2/v3)
      WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}

      # Email (shared with v2/v3)
      YANDEX_SMTP_USER: ${{ secrets.YANDEX_SMTP_USER }}
      YANDEX_SMTP_APP_PASS: ${{ secrets.YANDEX_SMTP_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # GigaChat (shared with v2/v3)
      GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
      GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-2' }}
      GIGACHAT_TIMEOUT_SEC: ${{ vars.GIGACHAT_TIMEOUT_SEC || '60' }}
      GIGACHAT_VERIFY_SSL_CERTS: ${{ vars.GIGACHAT_VERIFY_SSL_CERTS || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v5/requirements.txt

      - name: Prepare local audit inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          seller = str(os.environ.get("V5_SELLER_ID") or "seller_001").strip() or "seller_001"
          repo = Path(".").resolve()
          input_dir = repo / "cabinets" / seller / "input"
          unpack_root = input_dir / "__unpacked"
          input_dir.mkdir(parents=True, exist_ok=True)
          unpack_root.mkdir(parents=True, exist_ok=True)

          # Collect input files from various locations
          source_dirs = [
              repo / "input",
              repo / ".github" / "input",
              repo / "data" / "input",
              repo / "audit" / "input",
              repo / "cabinets" / seller / "input",
              repo / "cabinets" / "__missing_seller__" / "input",
          ]
          allowed_ext = {".zip", ".xlsx", ".xls", ".csv"}

          copied = []
          for source_dir in source_dirs:
              if not source_dir.is_dir():
                  continue
              for path in source_dir.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix.lower() not in allowed_ext:
                      continue
                  target = input_dir / path.name
                  if path.resolve() == target.resolve():
                      continue
                  shutil.copy2(path, target)
                  copied.append(target)

          unpacked = []
          for archive_path in sorted(input_dir.glob("*.zip")):
              target_dir = unpack_root / archive_path.stem
              target_dir.mkdir(parents=True, exist_ok=True)
              try:
                  with zipfile.ZipFile(archive_path, "r") as zf:
                      for info in zf.infolist():
                          if info.is_dir():
                              continue
                          entry = Path(info.filename)
                          if entry.suffix.lower() not in {".xlsx", ".xls", ".csv"}:
                              continue
                          normalized = entry.as_posix()
                          if normalized.startswith("/") or ".." in normalized.split("/"):
                              continue
                          out_path = (target_dir / normalized).resolve()
                          if not str(out_path).startswith(str(target_dir.resolve())):
                              continue
                          out_path.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(info, "r") as source_fh, open(out_path, "wb") as out_fh:
                              shutil.copyfileobj(source_fh, out_fh)
                          unpacked.append(out_path)
              except Exception as exc:
                  print(f"[v5] archive_unpack_error file={archive_path.name} error={exc}")

          available = sorted(
              str(path.relative_to(repo)).replace("\\", "/")
              for path in input_dir.rglob("*")
              if path.is_file() and path.suffix.lower() in {".xlsx", ".xls", ".csv"}
          )
          print(f"[v5] local_inputs seller={seller} copied={len(copied)} unpacked={len(unpacked)} available={len(available)}")
          for rel_path in available[:30]:
              print(f"[v5] local_input_file {rel_path}")
          PY

      - name: Prepare cabinet directories
        run: |
          mkdir -p "cabinets/${V5_SELLER_ID}/artifacts"
          mkdir -p "cabinets/${V5_SELLER_ID}/memory"
          mkdir -p "cabinets/${V5_SELLER_ID}/outputs"

      - name: Run V5 daily audit pipeline
        run: |
          set -euo pipefail
          echo "[v5] Starting daily audit run"
          echo "[v5] seller_id=${V5_SELLER_ID}"
          if [ -n "${V5_REQUESTED_DATE}" ]; then
            echo "[v5] requested_date=${V5_REQUESTED_DATE}"
            python -m v5.entry daily \
              --seller "${V5_SELLER_ID}" \
              --date "${V5_REQUESTED_DATE}" \
              --mode "${V5_MODE}"
          else
            echo "[v5] requested_date=<auto-resolve by timezone>"
            python -m v5.entry daily \
              --seller "${V5_SELLER_ID}" \
              --mode "${V5_MODE}"
          fi
          echo "[v5] Pipeline finished"

      - name: Print cabinet artifacts
        run: |
          echo "[v5] Artifacts in ./cabinets/${V5_SELLER_ID}:"
          find "cabinets/${V5_SELLER_ID}" -type f -name "*.json" -o -name "*.pdf" | sort || true

      - name: Upload V5 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-daily-audit-${{ env.V5_SELLER_ID }}
          path: cabinets/${{ env.V5_SELLER_ID }}/artifacts/**

      - name: Check for PDF reports
        if: always()
        run: |
          REPORT=$(find "cabinets/${V5_SELLER_ID}/outputs" -name "*.pdf" -type f | head -1)
          if [ -n "$REPORT" ]; then
            echo "[v5] PDF report generated: $REPORT"
          else
            echo "[v5] No PDF report generated"
          fi
