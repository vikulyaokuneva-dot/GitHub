name: V2 Audit Manual

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Label for audit period, for example 2026-02-23_2026-03-01"
        required: false
        default: ""

jobs:
  v2_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Moscow
      WB_TAX_RATE: ${{ vars.WB_TAX_RATE || '0.06' }}
      WB_TIMEZONE: Europe/Moscow
      PYTHONPATH: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare audit artifacts folder
        run: |
          mkdir -p audit/artifacts

      - name: Run V2 audit
        run: |
          set -euo pipefail
          python audit/run_audit.py \
            --period "${{ github.event.inputs.period }}" \
            --input_dir audit/input \
            --out_dir audit/artifacts

      - name: Print audit files
        if: always()
        run: |
          echo "Artifacts in audit/artifacts:"
          find audit/artifacts -maxdepth 2 -type f | sort || true

      - name: Upload V2 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-audit-artifacts
          path: audit/artifacts/**
