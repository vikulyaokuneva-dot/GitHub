name: WB Audit (offline)

on:
  workflow_dispatch:
    inputs:
      seller_id:
        description: "Seller ID (default: seller_001)"
        required: false
        default: "seller_001"
      period:
        description: "Label for the audit period, e.g. 2026-02-23_2026-03-01"
        required: false
        default: ""

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      WB_SELLER_ID: ${{ github.event.inputs.seller_id || 'seller_001' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run audit
        env:
          WB_TAX_RATE: "0.06"
          WB_TIMEZONE: "Europe/Moscow"
          PYTHONPATH: "."
        run: |
          mkdir -p "cabinets/${WB_SELLER_ID}/input"
          python audit/run_audit.py --seller "${WB_SELLER_ID}" --period "${{ github.event.inputs.period }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wb-audit-${{ env.WB_SELLER_ID }}
          path: cabinets/${{ env.WB_SELLER_ID }}/artifacts/*
