name: WB Daily Report

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      seller_id:
        description: "Seller ID (default: seller_001)"
        required: false
        default: "seller_001"
      run_date:
        description: "Optional report date (YYYY-MM-DD). Leave empty for auto-resolve"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WB_SELLER_ID: ${{ github.event.inputs.seller_id || 'seller_001' }}
      WB_REQUESTED_DATE: ${{ github.event.inputs.run_date || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare local WB inputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          seller = str(os.environ.get("WB_SELLER_ID") or "seller_001").strip() or "seller_001"
          repo = Path(".").resolve()
          input_dir = repo / "cabinets" / seller / "input"
          unpack_root = input_dir / "__unpacked"
          input_dir.mkdir(parents=True, exist_ok=True)
          unpack_root.mkdir(parents=True, exist_ok=True)

          source_dirs = [
              repo / "input",
              repo / ".github" / "input",
              repo / "data" / "input",
              repo / "audit" / "input",
              repo / "cabinets" / seller / "input",
              repo / "cabinets" / "__missing_seller__" / "input",
          ]
          allowed_ext = {".zip", ".xlsx", ".xls", ".csv"}

          copied = []
          for source_dir in source_dirs:
              if not source_dir.is_dir():
                  continue
              for path in source_dir.rglob("*"):
                  if not path.is_file():
                      continue
                  if path.suffix.lower() not in allowed_ext:
                      continue
                  target = input_dir / path.name
                  if path.resolve() == target.resolve():
                      continue
                  shutil.copy2(path, target)
                  copied.append(target)

          unpacked = []
          for archive_path in sorted(input_dir.glob("*.zip")):
              target_dir = unpack_root / archive_path.stem
              target_dir.mkdir(parents=True, exist_ok=True)
              try:
                  with zipfile.ZipFile(archive_path, "r") as zf:
                      for info in zf.infolist():
                          if info.is_dir():
                              continue
                          entry = Path(info.filename)
                          if entry.suffix.lower() not in {".xlsx", ".xls", ".csv"}:
                              continue
                          normalized = entry.as_posix()
                          if normalized.startswith("/") or ".." in normalized.split("/"):
                              continue
                          out_path = (target_dir / normalized).resolve()
                          if not str(out_path).startswith(str(target_dir.resolve())):
                              continue
                          out_path.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(info, "r") as source_fh, open(out_path, "wb") as out_fh:
                              shutil.copyfileobj(source_fh, out_fh)
                          unpacked.append(out_path)
              except Exception as exc:
                  print(f"[workflow] archive_unpack_error file={archive_path.name} error={exc}")

          available = sorted(
              str(path.relative_to(repo)).replace("\\", "/")
              for path in input_dir.rglob("*")
              if path.is_file() and path.suffix.lower() in {".xlsx", ".xls", ".csv"}
          )
          print(f"[workflow] local_inputs seller={seller} copied={len(copied)} unpacked={len(unpacked)} available={len(available)}")
          for rel_path in available[:30]:
              print(f"[workflow] local_input_file {rel_path}")
          PY

      - name: Run report
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_SMTP_USER: ${{ secrets.YANDEX_SMTP_USER }}
          YANDEX_SMTP_APP_PASS: ${{ secrets.YANDEX_SMTP_APP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
          TZ: "Europe/Moscow"
          GIGACHAT_DEBUG: "1"
          GIGACHAT_VERIFY_SSL_CERTS: "false"
          GIGACHAT_MODEL: "GigaChat-2"
          GIGACHAT_TIMEOUT_SEC: "60"
        run: |
          set -euo pipefail
          echo "[workflow] pipeline started"
          echo "[workflow] seller resolved: ${WB_SELLER_ID}"
          if [ -n "${WB_REQUESTED_DATE}" ]; then
            echo "[workflow] requested date: ${WB_REQUESTED_DATE}"
            DATE_ARGS=(--date "${WB_REQUESTED_DATE}")
          else
            echo "[workflow] requested date: <empty> (pipeline auto-resolve by timezone)"
            DATE_ARGS=()
          fi
          python -m v3.entry daily --seller "${WB_SELLER_ID}" "${DATE_ARGS[@]}"
          echo "[workflow] pipeline finished"

      - name: Print run summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          seller = str(os.environ.get("WB_SELLER_ID") or "").strip()
          artifacts_dir = Path("cabinets") / seller / "artifacts"
          job_path = artifacts_dir / "job.json"
          print(f"[workflow] artifacts_dir={artifacts_dir}")
          if not job_path.is_file():
              print("[workflow] summary unavailable: job.json not found")
              raise SystemExit(0)

          with job_path.open("r", encoding="utf-8") as fh:
              job = json.load(fh)

          api = job.get("api_debug", {}) if isinstance(job.get("api_debug"), dict) else {}
          event = job.get("event_date_model", {}) if isinstance(job.get("event_date_model"), dict) else {}
          decisions = job.get("decisions", {}) if isinstance(job.get("decisions"), dict) else {}
          health = job.get("health_score", {}) if isinstance(job.get("health_score"), dict) else {}

          decisions_count = 0
          if isinstance(decisions.get("rows"), list):
              decisions_count = len(decisions.get("rows", []))
          elif isinstance(decisions.get("items"), list):
              decisions_count = len(decisions.get("items", []))

          health_count = len(health.get("items", [])) if isinstance(health.get("items"), list) else 0

          print(
              "[workflow] summary "
              f"seller_id={job.get('seller_id')} "
              f"report_date={event.get('report_date') or job.get('run_date')} "
              f"input_files_detected={int(api.get('input_files_detected', 0) or 0)} "
              f"supplier_goods_found={bool(api.get('supplier_goods_daily_found', False))} "
              f"financial_source={api.get('financial_contour_source')} "
              f"funnel_source={api.get('funnel_source')} "
              f"orders_rows={int(api.get('orders_rows', 0) or 0)} "
              f"buyouts_rows={int(api.get('sales_rows', 0) or 0)} "
              f"financial_rows={int(api.get('financial_rows', 0) or 0)} "
              f"ads_rows={int(api.get('ads_rows', 0) or 0)} "
              f"decisions_count={decisions_count} "
              f"health_score_count={health_count}"
          )
          print(
              "[workflow] email "
              f"attempted={job.get('email_attempted')} "
              f"sent={job.get('email_sent')} "
              f"transport_status={job.get('email_transport_status')} "
              f"stage={job.get('email_stage')} "
              f"reason={job.get('email_failure_reason_normalized')}"
          )
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wb-report-${{ env.WB_SELLER_ID }}
          path: cabinets/${{ env.WB_SELLER_ID }}/artifacts/**
