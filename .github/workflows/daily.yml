name: WB Daily Report

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      seller_id:
        description: "Seller ID (default: seller_001)"
        required: false
        default: "seller_001"
      run_date:
        description: "Optional report date (YYYY-MM-DD). Leave empty for auto-resolve"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WB_SELLER_ID: ${{ github.event.inputs.seller_id || 'seller_001' }}
      WB_REQUESTED_DATE: ${{ github.event.inputs.run_date || '' }}
      REPORT_VERSION: "v2"
    steps:
      - uses: actions/checkout@v4

      - name: Restore seller history
        uses: actions/cache/restore@v4
        with:
          path: |
            cabinets/${{ env.WB_SELLER_ID }}/history
            cabinets/${{ env.WB_SELLER_ID }}/artifacts/wb_api_core
            cabinets/${{ env.WB_SELLER_ID }}/data/product_prices.sqlite3
          key: wb-history-${{ env.WB_SELLER_ID }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wb-history-${{ env.WB_SELLER_ID }}-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare seller-scoped input context
        run: |
          set -euo pipefail
          INPUT_DIR="cabinets/${WB_SELLER_ID}/input"
          mkdir -p "${INPUT_DIR}"
          echo "[workflow] seller_scoped_input=${INPUT_DIR}"
          find "${INPUT_DIR}" -maxdepth 3 -type f | sort || true

      - name: Run report
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          YANDEX_SMTP_USER: ${{ secrets.YANDEX_SMTP_USER }}
          YANDEX_SMTP_APP_PASS: ${{ secrets.YANDEX_SMTP_APP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          USE_GIGACHAT: "false"
          GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
          TZ: "Europe/Moscow"
          GIGACHAT_DEBUG: "1"
          GIGACHAT_VERIFY_SSL_CERTS: "false"
          GIGACHAT_MODEL: "GigaChat-2"
          GIGACHAT_TIMEOUT_SEC: "60"
        run: |
          set -euo pipefail
          echo "[workflow] pipeline started"
          echo "[workflow] REPORT_VERSION=${REPORT_VERSION:-<empty>}"
          echo "[workflow] seller resolved: ${WB_SELLER_ID}"
          echo "[workflow] WB_API_TOKEN_secret_present=${{ secrets.WB_API_TOKEN != '' }}"
          echo "[workflow] WB_API_TOKEN_present=$([ -n "${WB_API_TOKEN:-}" ] && echo true || echo false)"
          echo "[workflow] WB_API_TOKEN_len=${#WB_API_TOKEN}"
          if [ -z "${WB_API_TOKEN:-}" ]; then
            echo "::error::WB_API_TOKEN is empty in the Run report step environment"
            exit 1
          fi
          if [ -n "${WB_REQUESTED_DATE}" ]; then
            echo "[workflow] requested date: ${WB_REQUESTED_DATE}"
            CORE_RUN_DATE="${WB_REQUESTED_DATE}"
            DATE_ARGS=(--date "${WB_REQUESTED_DATE}")
          else
            echo "[workflow] requested date: <empty> (pipeline auto-resolve by timezone)"
            CORE_RUN_DATE="$(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          print(datetime.now(ZoneInfo("Europe/Moscow")).date().isoformat())
          PY
          )"
            DATE_ARGS=()
          fi
          echo "[workflow] core_run_date=${CORE_RUN_DATE}"
          CORE_STARTED_AT="$(date +%s)"
          python -m wb_api_core.run_daily --seller "${WB_SELLER_ID}" --date "${CORE_RUN_DATE}"
          CORE_ARTIFACTS_DIR="cabinets/${WB_SELLER_ID}/artifacts/wb_api_core/${CORE_RUN_DATE}"
          CORE_SNAPSHOT_PATH="${CORE_ARTIFACTS_DIR}/snapshot.json"
          CORE_DEBUG_PATH="${CORE_ARTIFACTS_DIR}/debug.json"
          echo "[workflow] core_snapshot_path=${CORE_SNAPSHOT_PATH}"
          echo "[workflow] core_debug_path=${CORE_DEBUG_PATH}"
          if [ ! -f "${CORE_SNAPSHOT_PATH}" ] || [ ! -f "${CORE_DEBUG_PATH}" ]; then
            echo "::error::wb_api_core did not create required snapshot/debug artifacts"
            exit 1
          fi
          SNAPSHOT_MTIME="$(stat -c %Y "${CORE_SNAPSHOT_PATH}")"
          DEBUG_MTIME="$(stat -c %Y "${CORE_DEBUG_PATH}")"
          if [ "${SNAPSHOT_MTIME}" -lt "${CORE_STARTED_AT}" ] || [ "${DEBUG_MTIME}" -lt "${CORE_STARTED_AT}" ]; then
            echo "::error::wb_api_core snapshot/debug artifacts are stale"
            exit 1
          fi
          python -m v3.history.api_history_backfill --seller "${WB_SELLER_ID}" --date "${CORE_RUN_DATE}"
          python -m v3.entry daily --seller "${WB_SELLER_ID}" "${DATE_ARGS[@]}"
          echo "[workflow] pipeline finished"

      - name: Print run summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          seller = str(os.environ.get("WB_SELLER_ID") or "").strip()
          artifacts_dir = Path("cabinets") / seller / "artifacts"
          job_path = artifacts_dir / "job.json"
          print(f"[workflow] artifacts_dir={artifacts_dir}")
          if not job_path.is_file():
              print("[workflow] summary unavailable: job.json not found")
              raise SystemExit(0)

          with job_path.open("r", encoding="utf-8") as fh:
              job = json.load(fh)

          api = job.get("api_debug", {}) if isinstance(job.get("api_debug"), dict) else {}
          event = job.get("event_date_model", {}) if isinstance(job.get("event_date_model"), dict) else {}
          decisions = job.get("decisions", {}) if isinstance(job.get("decisions"), dict) else {}
          health = job.get("health_score", {}) if isinstance(job.get("health_score"), dict) else {}

          decisions_count = 0
          if isinstance(decisions.get("rows"), list):
              decisions_count = len(decisions.get("rows", []))
          elif isinstance(decisions.get("items"), list):
              decisions_count = len(decisions.get("items", []))

          health_count = len(health.get("items", [])) if isinstance(health.get("items"), list) else 0

          print(
              "[workflow] summary "
              f"seller_id={job.get('seller_id')} "
              f"report_version={job.get('report_version')} "
              f"report_date={event.get('report_date') or job.get('run_date')} "
              f"input_files_detected={int(api.get('input_files_detected', 0) or 0)} "
              f"supplier_goods_found={bool(api.get('supplier_goods_daily_found', False))} "
              f"financial_source={api.get('financial_contour_source')} "
              f"funnel_source={api.get('funnel_source')} "
              f"orders_rows={int(api.get('orders_rows', 0) or 0)} "
              f"buyouts_rows={int(api.get('sales_rows', 0) or 0)} "
              f"financial_rows={int(api.get('financial_rows', 0) or 0)} "
              f"ads_rows={int(api.get('ads_rows', 0) or 0)} "
              f"decisions_count={decisions_count} "
              f"health_score_count={health_count}"
          )
          print(
              "[workflow] email "
              f"attempted={job.get('email_attempted')} "
              f"sent={job.get('email_sent')} "
              f"transport_status={job.get('email_transport_status')} "
              f"stage={job.get('email_stage')} "
              f"reason={job.get('email_failure_reason_normalized')}"
          )
          PY

      - name: Save seller history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            cabinets/${{ env.WB_SELLER_ID }}/history
            cabinets/${{ env.WB_SELLER_ID }}/artifacts/wb_api_core
            cabinets/${{ env.WB_SELLER_ID }}/data/product_prices.sqlite3
          key: wb-history-${{ env.WB_SELLER_ID }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload report V2
        uses: actions/upload-artifact@v4
        with:
          name: wb-report-${{ env.WB_SELLER_ID }}
          path: cabinets/${{ env.WB_SELLER_ID }}/artifacts/report_v2.pdf
          if-no-files-found: error
