name: V5 Daily API (API Mode)

on:
  schedule:
    # GitHub Actions cron is UTC. Moscow is UTC+3 year-round.
    # 06:00 Europe/Moscow == 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      seller_id:
        description: "Seller ID (default: seller_001)"
        required: false
        default: "seller_001"
      run_date:
        description: "Optional run date YYYY-MM-DD (empty = auto-resolve)"
        required: false
        default: ""

jobs:
  v5_daily_api:
    if: ${{ vars.V5_SCHEDULE_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # V5 config
      V5_SELLER_ID: ${{ github.event.inputs.seller_id || vars.V5_SCHEDULE_SELLER || 'seller_001' }}
      V5_REQUESTED_DATE: ${{ github.event.inputs.run_date || '' }}
      V5_MODE: api
      TZ: Europe/Moscow

      # WB API (shared with v2/v3)
      WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}

      # Email (shared with v2/v3)
      YANDEX_SMTP_USER: ${{ secrets.YANDEX_SMTP_USER }}
      YANDEX_SMTP_APP_PASS: ${{ secrets.YANDEX_SMTP_APP_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}

      # GigaChat (shared with v2/v3)
      GIGACHAT_SCOPE: ${{ secrets.GIGACHAT_SCOPE }}
      GIGACHAT_MODEL: ${{ vars.GIGACHAT_MODEL || 'GigaChat-2' }}
      GIGACHAT_TIMEOUT_SEC: ${{ vars.GIGACHAT_TIMEOUT_SEC || '60' }}
      GIGACHAT_VERIFY_SSL_CERTS: ${{ vars.GIGACHAT_VERIFY_SSL_CERTS || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v5/requirements.txt

      - name: Prepare cabinet directories
        run: |
          mkdir -p "cabinets/${V5_SELLER_ID}/v5/artifacts"
          mkdir -p "cabinets/${V5_SELLER_ID}/v5/memory"
          mkdir -p "cabinets/${V5_SELLER_ID}/v5/outputs"

      - name: Run V5 daily API pipeline
        run: |
          set -euo pipefail
          echo "[v5] Starting daily API run"
          echo "[v5] cabinet=${V5_SELLER_ID}"
          if [ -n "${V5_REQUESTED_DATE}" ]; then
            echo "[v5] requested_date=${V5_REQUESTED_DATE}"
            python -m v5.entry daily --cabinet "${V5_SELLER_ID}" --date "${V5_REQUESTED_DATE}"
          else
            echo "[v5] requested_date=<auto D-1 by Europe/Berlin policy>"
            python -m v5.entry daily --cabinet "${V5_SELLER_ID}"
          fi
          echo "[v5] Pipeline finished"

      - name: Print cabinet artifacts
        run: |
          echo "[v5] Artifacts in ./cabinets/${V5_SELLER_ID}/v5:"
          find "cabinets/${V5_SELLER_ID}/v5" -type f \( -name "*.json" -o -name "*.pdf" \) | sort || true

      - name: Upload V5 API artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-daily-api-${{ env.V5_SELLER_ID }}
          path: cabinets/${{ env.V5_SELLER_ID }}/v5/artifacts/**

      - name: Check for PDF reports
        if: always()
        run: |
          REPORT=$(find "cabinets/${V5_SELLER_ID}/v5/artifacts" -name "*.pdf" -type f | head -1)
          if [ -n "$REPORT" ]; then
            echo "[v5] PDF report generated: $REPORT"
          else
            echo "[v5] No PDF report generated"
          fi
